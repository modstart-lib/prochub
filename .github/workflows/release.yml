name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  APP_NAME: 'ProcHub'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            goarch: amd64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            goarch: arm64
          - name: mac-x64
            os: macos-latest
            goarch: amd64
          - name: mac-arm64
            os: macos-latest
            goarch: arm64
          - name: win-x64
            os: windows-latest
            goarch: amd64
          - name: win-arm64
            os: windows-11-arm
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Git clone repo
        if: runner.os == 'Linux' || runner.os == 'macOS'
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_PASS: ${{ secrets.GIT_PASS }}
          GIT_REPO_BASE: ${{ secrets.GIT_REPO_BASE }}
          GIT_HOST: ${{ secrets.GIT_HOST }}
        run: |
          git clone -b main "https://${GIT_USER}:${GIT_PASS}@${GIT_HOST}/${GIT_REPO_BASE}/prochub-pro.git" code

      - name: Git clone repo
        if: runner.os == 'Windows'
        env:
          GIT_USER: ${{ secrets.GIT_USER }}
          GIT_PASS: ${{ secrets.GIT_PASS }}
          GIT_REPO_BASE: ${{ secrets.GIT_REPO_BASE }}
          GIT_HOST: ${{ secrets.GIT_HOST }}
        shell: pwsh
        run: |
          git clone -b main "https://${env:GIT_USER}:${env:GIT_PASS}@${env:GIT_HOST}/${env:GIT_REPO_BASE}/prochub-pro.git" code

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Prepare (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev

      - name: Import Code Signing Certificates (macOS)
        if: runner.os == 'macOS'
        env:
          CORP_MACOS_CERTIFICATE: ${{ secrets.CORP_MACOS_CERTIFICATE }}
          CORP_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.CORP_MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$CORP_MACOS_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CORP_MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Find signing identity
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          echo "Found signing identity: $SIGNING_IDENTITY"

      - name: Install Dependencies (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        working-directory: code/frontend
        run: npm install

      - name: Configure Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Visual Studio Build Tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $params = @(
            "--add", "Microsoft.VisualStudio.Workload.VCTools",
            "--includeRecommended"
          )
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $params += @(
              "--add", "Microsoft.VisualStudio.Component.VC.ARM64",
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
            )
          }
          choco install visualstudio2022buildtools --params ($params -join ' ') -y

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: code/frontend
        shell: pwsh
        run: npm install

      - name: Build Release Files (Linux)
        if: runner.os == 'Linux'
        working-directory: code
        run: |
          wails build -platform linux/${{ matrix.goarch }} -trimpath -ldflags "-s -w"
          VERSION=$(sed -n 's/.*Version:[[:space:]]*"v*\([^"]*\)".*/\1/p' app.go | head -1)
          bash scripts/package-linux.sh ${{ matrix.goarch }} "$VERSION"

      - name: Build Release Files (Windows)
        if: runner.os == 'Windows'
        working-directory: code
        shell: pwsh
        run: |
          wails build -platform windows/${{ matrix.goarch }} -trimpath -ldflags "-s -w" -nsis
          $VERSION = (Select-String -Path app.go -Pattern 'Version:\s*"v*([^"]*)"').Matches.Groups[1].Value
          echo "VERSION=$VERSION"
          cd build/bin
          7z a "../../ProcHub-${VERSION}-windows-${{ matrix.goarch }}.zip" ProcHub.exe
          $installer = Get-ChildItem -Filter "*-installer.exe" | Select-Object -First 1
          if ($installer) {
            Rename-Item -Path $installer.FullName -NewName "ProcHub-${VERSION}-${{ matrix.goarch }}-installer.exe"
          }
          cd ../..

      - name: Build Release Files (macOS)
        if: runner.os == 'macOS'
        working-directory: code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_ARCH: ${{ matrix.goarch }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          wails build -platform darwin/${{ matrix.goarch }} -trimpath -ldflags "-s -w"
          VERSION=$(sed -n 's/.*Version:[[:space:]]*"v*\([^"]*\)".*/\1/p' app.go | head -1)

          APP_PATH="build/bin/ProcHub.app"

          # Sign all frameworks and libraries first
          find "$APP_PATH" -name "*.dylib" -o -name "*.framework" | while read lib; do
            codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$lib" || true
          done

          # Sign the main executable
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH/Contents/MacOS/ProcHub"

          # Sign the entire app bundle
          codesign --force --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH"

          # Verify the signature
          codesign --verify --verbose=4 "$APP_PATH"

          # Create DMG
          brew install create-dmg
          create-dmg \
            --volname "ProcHub" \
            --volicon "build/bin/ProcHub.app/Contents/Resources/iconfile.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "ProcHub.app" 150 185 \
            --hide-extension "ProcHub.app" \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "ProcHub-${VERSION}-darwin-${{ matrix.goarch }}.dmg" \
            "build/bin/ProcHub.app" || true

          # Fallback: if create-dmg fails, use hdiutil
          if [ ! -f "ProcHub-${VERSION}-darwin-${{ matrix.goarch }}.dmg" ]; then
            hdiutil create -volname "ProcHub" -srcfolder "build/bin/ProcHub.app" -ov -format UDZO "ProcHub-${VERSION}-darwin-${{ matrix.goarch }}.dmg"
          fi

          # Sign DMG
          codesign --force --sign "$SIGNING_IDENTITY" "ProcHub-${VERSION}-darwin-${{ matrix.goarch }}.dmg"

          # Notarize
          xcrun notarytool submit "ProcHub-${VERSION}-darwin-${{ matrix.goarch }}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          # Staple the notarization ticket
          xcrun stapler staple "ProcHub-${VERSION}-darwin-${{ matrix.goarch }}.dmg"

      - name: Set Build Name ( Linux / macOS )
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          DIST_FILE_NAME=${{ runner.os }}-${{ runner.arch }}-v$(date +%Y%m%d_%H%M%S)-${RANDOM}
          echo ::add-mask::$DIST_FILE_NAME
          echo DIST_FILE_NAME=$DIST_FILE_NAME >> $GITHUB_ENV

      - name: Set Build Name ( Windows )
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = "${{ runner.arch }}"
          $randomNumber = Get-Random -Minimum 10000 -Maximum 99999
          $DIST_FILE_NAME = "Windows-$arch-v$(Get-Date -Format 'yyyyMMdd_HHmmss')-$randomNumber"
          Write-Host "::add-mask::$DIST_FILE_NAME"
          echo "DIST_FILE_NAME=$DIST_FILE_NAME" >> $env:GITHUB_ENV

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: prochub-win-${{ matrix.goarch }}
          path: |
            code/ProcHub-*-windows-${{ matrix.goarch }}.zip
            code/build/bin/ProcHub-*-installer.exe

      - name: Upload Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: prochub-mac-${{ matrix.goarch }}
          path: code/ProcHub-*-darwin-${{ matrix.goarch }}.dmg

      - name: Upload Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: prochub-linux-${{ matrix.goarch }}
          path: |
            code/ProcHub-*-linux-${{ matrix.goarch }}.deb
            code/ProcHub-*-linux-${{ matrix.goarch }}.AppImage

      - name: Upload to OSS
        id: oss-upload
        uses: modstart/github-oss-action@master
        with:
          title: ${{ github.ref_name }}
          key-id: ${{ secrets.OSS_2_KEY_ID }}
          key-secret: ${{ secrets.OSS_2_KEY_SECRET }}
          region: ${{ secrets.OSS_2_REGION }}
          bucket: ${{ secrets.OSS_2_BUCKET }}
          callbackTitle: 🎉ProcHub-${{ runner.os }}-Release-${{ github.ref_name }}
          callback: ${{ secrets.REPORT_URL_ME }}
          assets: |
              code/ProcHub-*-linux-*.deb:apps/{random}.bin:{name}.deb
              code/ProcHub-*-linux-*.AppImage:apps/{random}.bin:{name}.AppImage
              code/ProcHub-*-windows-*.zip:apps/{random}.bin:{name}.zip
              code/build/bin/ProcHub-*-installer.exe:apps/{random}.bin:{name}.exe
              code/ProcHub-*-darwin-*.dmg:apps/{random}.bin:{name}.dmg

      - name: Save OSS Downloads for Notify
        shell: bash
        env:
          OSS_DOWNLOADS: ${{ steps.oss-upload.outputs.downloads }}
        run: |
          if [ -n "${OSS_DOWNLOADS}" ]; then
            # No echo of the value needed; output is masked by core.setSecret
            echo "${OSS_DOWNLOADS}" > "oss-downloads-${{ matrix.name }}.json"
          else
            echo "{}" > "oss-downloads-${{ matrix.name }}.json"
          fi

      - name: Upload OSS Downloads Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oss-downloads-${{ matrix.name }}
          path: oss-downloads-${{ matrix.name }}.json

  # ── Release ────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: prochub-*
          path: _artifacts
          merge-multiple: false
      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Delete any existing release for this tag (handles force-push)
          gh release delete "$TAG" --yes 2>/dev/null || true
          # Create release (draft, idempotent)
          gh release create "$TAG" \
            --title "$TAG" \
            --draft \
            --prerelease=false \
            --notes "" \
            2>/dev/null || true
          # Upload all artifacts
          find _artifacts/ -type f | while read f; do
            echo "Uploading: $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
          done

  # ── Notify ────────────────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: [release]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download OSS Downloads Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: oss-downloads-*
          path: _oss-downloads
          merge-multiple: true

      - name: Notify Webhook
        run: |
          # Merge all OSS download maps into a single JSON string
          MERGED="{}"
          for f in _oss-downloads/*.json; do
            [ -f "$f" ] || continue
            content=$(cat "$f")
            [ -z "$content" ] && content="{}"
            MERGED=$(node -e "
              const a = JSON.parse(process.argv[1]);
              const b = JSON.parse(process.argv[2]);
              console.log(JSON.stringify(Object.assign(a, b)));
            " "$MERGED" "$content")
          done
          echo "::add-mask::${MERGED}"

          NAME="${{ github.event.repository.name }}"
          TYPE=$(echo "${{ github.workflow }}" | tr '[:upper:]' '[:lower:]')
          VERSION=$(sed -n 's/.*Version:[[:space:]]*"v*\([^"]*\)".*/\1/p' app.go | head -1)

          PAYLOAD=$(node -e "
            const p = {
              event: process.argv[1],
              param: { name: process.argv[1], type: process.argv[2], version: process.argv[3] },
              data: { name: process.argv[1], type: process.argv[2], version: process.argv[3], downloads: process.argv[4] }
            };
            console.log(JSON.stringify(p));
          " "$NAME" "$TYPE" "$VERSION" "$MERGED")
          echo "::add-mask::${PAYLOAD}"

          curl -X POST "${{ secrets.HOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"

      - name: Clean up OSS Downloads Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting oss-downloads-* artifacts for run ${{ github.run_id }}..."
          gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("oss-downloads-")) | .id' \
            | while read id; do
              echo "  deleting artifact id=$id"
              gh api "/repos/${{ github.repository }}/actions/artifacts/$id" -X DELETE
            done
          echo "Cleanup done."
