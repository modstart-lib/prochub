name: Test

on:
  push:
    branches:
      - main

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'
  APP_NAME: 'ProcHub'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            goarch: amd64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            goarch: arm64
          - name: mac-x64
            os: macos-latest
            goarch: amd64
          - name: mac-arm64
            os: macos-latest
            goarch: arm64
          - name: win-x64
            os: windows-latest
            goarch: amd64
          - name: win-arm64
            os: windows-11-arm
            goarch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Prepare (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev

      - name: Install Dependencies (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        working-directory: frontend
        run: npm install

      - name: Configure Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "GYP_MSVS_VERSION=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "npm_config_msvs_version=2022" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Visual Studio Build Tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $params = @(
            "--add", "Microsoft.VisualStudio.Workload.VCTools",
            "--includeRecommended"
          )
          if ($env:RUNNER_ARCH -eq 'ARM64') {
            $params += @(
              "--add", "Microsoft.VisualStudio.Component.VC.ARM64",
              "--add", "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
            )
          }
          choco install visualstudio2022buildtools --params ($params -join ' ') -y

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: frontend
        shell: pwsh
        run: npm install

      - name: Build Test (Linux)
        if: runner.os == 'Linux'
        run: |
          wails build -platform linux/${{ matrix.goarch }} -trimpath -ldflags "-s -w"

      - name: Build Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          wails build -platform windows/${{ matrix.goarch }} -trimpath -ldflags "-s -w"

      - name: Build Test (macOS)
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/${{ matrix.goarch }} -trimpath -ldflags "-s -w"

      - name: Upload Artifact Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: |
            build/bin/ProcHub.exe

      - name: Upload Artifact Macos
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: |
            build/bin/ProcHub.app

      - name: Upload Artifact Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: |
            build/bin/ProcHub

  # ── Notify ────────────────────────────────────────────────────────────────────
  notify:
    name: Notify
    needs: [build]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Notify Webhook
        run: |
            NAME="${{ github.event.repository.name }}"
            TYPE=$(echo "${{ github.workflow }}" | tr '[:upper:]' '[:lower:]')
            VERSION=$(sed -n 's/.*Version:[[:space:]]*"v\([^"]*\)".*/\1/p' app.go | head -1)
            curl -X POST "${{ secrets.HOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"event\":\"${NAME}\",\"param\":{\"name\":\"${NAME}\",\"type\":\"${TYPE}\",\"version\":\"${VERSION}\"},\"data\":{\"name\":\"${NAME}\",\"type\":\"${TYPE}\",\"version\":\"${VERSION}\"}}"
